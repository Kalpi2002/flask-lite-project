{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<h2 class="text-danger mb-3">⚠️ Delete Task</h2>
<p>Are you sure you want to delete this task?</p>

<div class="card mb-3">
  <div class="card-body">
    <p><strong>Title:</strong> {{ task.title }}</p>
    <p><strong>Description:</strong> {{ task.description or "—" }}</p>
  </div>
</div>

<!-- Form to perform deletion -->
<form method="post" action="{{ url_for('delete_task', task_id=task.id) }}" style="display:inline;">
  <button type="submit" class="btn btn-danger">Yes, delete</button>
</form>

<!-- Cancel button -->
<a href="{{ url_for('task_list') }}" class="btn btn-secondary">Cancel</a>
{% endblock %}
