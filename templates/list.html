cat > templates/list.html <<'HTML'
{% extends 'base.html' %}

{% block content %}
<h2>Task List</h2>

<form method="get" action="/">
  <input type="text" name="q" placeholder="Search by title" value="{{ query or '' }}">
  <button type="submit">Search</button>
</form>

<table border='1'>
<tr><th>Title</th><th>Description</th><th>Created At</th></tr>
{% for task in tasks %}
<tr>
  <td>{{ task.title }}</td>
  <td>{{ task.description }}</td>
  <td>{{ task.created_at }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
HTML
