% extends "base.html" %}
{% block content %}
<form class="mb-3" method="get" action="{{ url_for('list_tasks') }}">
  <div class="input-group">
    <input name="q" value="{{ q }}" class="form-control" placeholder="Search by title">
    <button class="btn btn-outline-secondary">Search</button>
  </div>
</form>

<table class="table table-striped">
  <thead><tr><th>Title</th><th>Description</th><th>Created</th><th>Actions</th></tr></thead>
  <tbody>
    {% for t in tasks %}
    <tr>
      <td>{{ t.title }}</td>
      <td>{{ t.description }}</td>
      <td>{{ t.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
      <td>
        <a class="btn btn-sm btn-secondary" href="{{ url_for('edit_task', task_id=t.id) }}">Edit</a>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4">No tasks found</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
