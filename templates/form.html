{% extends "base.html" %}

{% block content %}
<h2>{{ action }} Task</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" value="{{ task.title if task else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control">{{ task.description if task else '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">{{ action }}</button>
    <a href="{{ url_for('list_tasks') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
